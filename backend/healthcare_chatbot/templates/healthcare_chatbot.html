<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthcare FAQ Chatbot</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 720px;
        margin: 48px auto;
        background: #fff;
        border: 1px solid #d9e2ec;
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      label,
      p {
        line-height: 1.5;
      }
      textarea {
        width: 100%;
        min-height: 110px;
        margin-top: 8px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #bcccdc;
        font-size: 1rem;
      }
      button {
        margin-top: 12px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      .response {
        margin-top: 22px;
        padding: 14px;
        border-radius: 8px;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>AI-Powered Healthcare FAQ Chatbot</h1>
      <p>
        Ask a health-related question. This chatbot checks a healthcare FAQ SQL
        database and returns the closest matching answer.
      </p>

      <form method="POST" action="/">
        <label for="question">Your question</label>
        <textarea id="question" name="question" required>{{ user_question }}</textarea>
        <button type="submit">Ask</button>
      </form>

      {% if bot_response %}
      <section class="response">
        <h2>Response</h2>
        <p>{{ bot_response }}</p>
      </section>
      {% endif %}
    </main>
  </body>
</html>
