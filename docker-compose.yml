services:
  backend:
    build:
      context: ./backend
    container_name: healthcare_backend
    environment:
      - API_PREFIX=/api
      - CORS_ORIGINS=*
      - RATE_LIMIT_PER_MINUTE=60
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: healthcare_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
